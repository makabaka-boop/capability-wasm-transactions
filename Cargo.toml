[package]
name = "plugin-host"
version = "0.1.0"
edition = "2021"
description = "Controlled multi-tenant Wasm plugin execution service (Wasmtime + SQLite)"

[dependencies]
wasmtime = "24"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"

[dev-dependencies]
wat = "1"
tempfile = "3"

[profile.release]
opt-level = 3
